<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhagavad-gītā verse — Gita</title>
<meta name="description" content="Open this verse in the Gita app.">
<style>
  :root { --bg:#FBF8F3; --text:#232120; --muted:#5F5850; --accent:#A04A12; --soft:#F6E3D2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14110F; --text:#EDE6DC; --muted:#B5ACA0; --accent:#E39A5E; --soft:#3A2A1E; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font:17px/1.5 Georgia, serif; text-align:center; padding:0 16px; }
  h1 { font-size:40px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:inline-block; padding:12px 24px; border-radius:999px; background:var(--soft);
          color:var(--accent); text-decoration:none; font:500 16px system-ui, sans-serif; margin:4px; }
</style>
</head>
<body>
<main>
  <h1>Gita</h1>
  <p id="ref">Opening the verse…</p>
  <a class="btn" id="open" href="#">Open in the app</a>
  <a class="btn" id="get" href="#">Get the app</a>
</main>
<script>
  // PLACEHOLDERS: replace with your store links (docs/sharing.md).
  const APP_STORE = 'https://apps.apple.com/app/idYOUR_APP_ID';
  const PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.versescroll.gita';

  const id = new URLSearchParams(location.search).get('id') || '';
  const valid = /^bg-\d{2}-\d{3}(-\d{3})?$/.test(id);
  const appUrl = 'gitaapp://open/verse' + (valid ? '?id=' + encodeURIComponent(id) : '');
  const ua = navigator.userAgent;
  const store = /android/i.test(ua) ? PLAY_STORE : APP_STORE;

  if (valid) {
    const m = id.match(/^bg-(\d{2})-(\d{3})(?:-(\d{3}))?$/);
    const label = (+m[1]) + '.' + (+m[2]) + (m[3] ? '-' + (+m[3]) : '');
    document.getElementById('ref').textContent = 'Bhagavad-gītā ' + label;
  }
  document.getElementById('open').href = appUrl;
  document.getElementById('get').href = store;

  // Try the app; if the page is still visible shortly after, it is not
  // installed, so go to the store.
  if (/iphone|ipad|ipod|android/i.test(ua)) {
    const started = Date.now();
    location.href = appUrl;
    setTimeout(() => {
      if (!document.hidden && Date.now() - started < 2500) location.href = store;
    }, 1600);
  }
</script>
</body>
</html>
